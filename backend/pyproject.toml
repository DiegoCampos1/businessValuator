[project]
name = "businessvaluator-backend"
version = "0.1.0"
description = "Backend FastAPI para o SaaS de análise de ações B3"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
